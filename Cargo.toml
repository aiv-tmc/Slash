[package]
name = "slash"
version = "0.2.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
axum = "0.7"
bincode = "1.3"
blake3 = "1.5"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }
curve25519-dalek = "4.1"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
futures = "0.3"
hex = "0.4"
libp2p = { version = "0.54", features = ["tokio", "tcp", "noise", "yamux", "gossipsub", "mdns", "identify", "request-response", "cbor"] }
rand = "0.8"
rpassword = "7.3"
rust-randomx = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
zeroize = { version = "1.7", features = ["derive"] }
aes-gcm = "0.10"
argon2 = "0.5"
anyhow = "1.0"

[[bench]]
name = "benchmarks"
harness = false
